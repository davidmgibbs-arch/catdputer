name: Build Cardputer ADV firmware
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Build firmware
        run: pio run -e cardputer-adv
      - name: Prepare firmware
        run: |
          mkdir -p dist
          cp .pio/build/cardputer-adv/firmware.bin dist/MistralPuter-ADV.bin
          sha256sum dist/MistralPuter-ADV.bin > dist/SHA256SUMS.txt
      - name: Upload firmware binary
        uses: actions/upload-artifact@v4
        with:
          name: MistralPuter-ADV-firmware
          path: dist/
          if-no-files-found: error
